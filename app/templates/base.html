<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title>{% block title %}{{ site_name }}{% endblock %}</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/static/css/app.css?v={{ version }}">
  {% block head %}{% endblock %}
</head>
<body class="{% block bodyclass %}{% endblock %}" data-theme="{{ site_theme|default('auto') }}"{% if site_accent %} style="--accent: {{ site_accent }}; --accent-soft: color-mix(in srgb, {{ site_accent }} 22%, transparent);"{% endif %}>
  {% block body %}{% endblock %}
</body>
</html>
